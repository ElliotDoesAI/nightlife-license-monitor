# Daily collection. Runs in the public repo but writes only to the private
# database. Logs print counts per source, never record contents.
name: daily-collect

on:
  schedule:
    # 15:30 UTC = 8:30 PT / 10:30 CT. After the CA export (~7am PT) and the
    # TX / NY / Chicago overnight refreshes.
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Only this source (blank = all). e.g. ny_sla_pending"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Collect all sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          RAW_RETENTION_DAYS: ${{ vars.RAW_RETENTION_DAYS || '14' }}
          STORAGE_ALARM_MB: ${{ vars.STORAGE_ALARM_MB || '400' }}
          HOT_MIN_SCORE: ${{ vars.HOT_MIN_SCORE || '75' }}
          ONLY_SOURCE: ${{ inputs.source }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -n "$ONLY_SOURCE" ]; then
            uv run licmon run --trigger "$TRIGGER" --source "$ONLY_SOURCE"
          else
            uv run licmon run --trigger "$TRIGGER"
          fi
      # Emails the owner a short counts-only note with the Excel lead sheet attached.
      # Runs even when a source failed, so the email reports it. Skips itself
      # when the email secrets are not set, and on one-source reruns. Logs
      # print counts and sent/failed only.
      - name: Email the owner
        if: ${{ !cancelled() && inputs.source == '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LEADS_EMAIL_FROM: ${{ secrets.LEADS_EMAIL_FROM }}
          LEADS_EMAIL_TO: ${{ secrets.LEADS_EMAIL_TO }}
          HOT_MIN_SCORE: ${{ vars.HOT_MIN_SCORE || '75' }}
        run: uv run licmon email
      # Upserts today's Hot and A venues into the Attio "License Leads" object
      # (internal CRM; nothing contacts a business). Skips itself when
      # ATTIO_API_KEY is not set. Logs counts only; the counts file feeds Slack.
      - name: Sync to Attio
        if: ${{ !cancelled() && inputs.source == '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
          ATTIO_DAILY_CAP: ${{ vars.ATTIO_DAILY_CAP || '25' }}
        run: uv run licmon attio-sync --write --counts "$RUNNER_TEMP/attio-counts.json"
      # Posts a short note to the team's Slack channel when there are new or
      # stage-advanced leads. Skips itself when SLACK_WEBHOOK_URL is not set.
      # The message is never printed here; the log says posted/skipped only.
      - name: Ping Slack
        if: ${{ !cancelled() && inputs.source == '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ATTIO_LEADS_URL: ${{ vars.ATTIO_LEADS_URL }}
        run: uv run licmon slack --counts "$RUNNER_TEMP/attio-counts.json"

  # GitHub switches off schedules in PUBLIC repos after 60 days with no
  # repository activity. Push an empty commit when the repo has been quiet for
  # 45 days. Skipped for private repos (no such rule there).
  keepalive:
    if: github.event_name == 'schedule' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit ${age_days} days ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: keep the daily schedule enabled"
            git push
          fi
